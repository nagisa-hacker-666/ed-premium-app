name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - run: npx expo install react react-native expo-secure-store expo-font expo-status-bar @expo/vector-icons @expo-google-fonts/space-grotesk @expo-google-fonts/jetbrains-mono @react-native-async-storage/async-storage react-native-safe-area-context expo-notifications expo-task-manager expo-background-task expo-image-picker expo-file-system react-native-webview expo-sensors -- --legacy-peer-deps
      - run: npx expo prebuild --platform android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: ed-ciel-apk
          path: android/app/build/outputs/apk/release/app-release.apk
